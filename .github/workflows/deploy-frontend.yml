name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment at a time
concurrency:
  group: "pages-frontend"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Next.js static export ───────────────────────────────────────
      # NEXT_PUBLIC_API_URL  – backend REST API (replaces the old __BACKEND_URL_PLACEHOLDER__)
      #                        Set secret BACKEND_URL in:
      #                        repo → Settings → Secrets and variables → Actions
      #                        Example: https://roadmap-manager-latest.onrender.com
      #
      # NEXT_PUBLIC_BASE_PATH – set this secret if the site is served from a sub-path
      #                         (e.g. /bootcamp-manager). Leave empty for a custom domain
      #                         deployed at the root.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.BASE_PATH }}
        run: npm run build

      # ── 5. Configure GitHub Pages ─────────────────────────────────────────────
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ── 6. Upload Next.js static export as the Pages artifact ────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      # ── 7. Deploy ─────────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4